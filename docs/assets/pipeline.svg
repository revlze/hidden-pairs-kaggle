<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
<title id="title">Hidden Pairs — финальный пайплайн NEW5</title>
<desc id="description">512 исходных признаков преобразуются в две ветки. S100 использует sqrt(raw) и пять дополнительных блоков с суммой шести RBF-ядер. Вспомогательная SVC использует PCA128 и агрегаты. Ранги предсказаний смешиваются с весами 80 и 20 процентов, затем ранжируются повторно и сохраняются в CSV. Преобразования обучаются на train, признаки с метками строятся inner out-of-fold.</desc>
